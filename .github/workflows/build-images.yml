name: Build and publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fralsecont
            image: ghcr.io/francolara/fralsecont
            context: .NET2026/SistemaAdministrativoWeb
            dockerfile: .NET2026/SistemaAdministrativoWeb/Dockerfile
          - name: fralsetech
            image: ghcr.io/francolara/fralsetech
            context: .NET2026/SistemaAdministrativoWeb/FralseTech.Web
            dockerfile: .NET2026/SistemaAdministrativoWeb/FralseTech.Web/Dockerfile
          - name: zonadeportiva
            image: ghcr.io/francolara/zonadeportiva
            context: .NET2026/SistemaControlEspaciosDeportivosWeb
            dockerfile: .NET2026/SistemaControlEspaciosDeportivosWeb/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
